name: Build Multi-Platform App Bundles

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  rust-unit-tests:
    name: Rust Protocol & Core Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run ctd-protocol & ctd-core unit tests
        working-directory: app
        run: cargo test -p ctd-protocol -p ctd-core

  build-bundles:
    name: Package (${{ matrix.platform }})
    needs: rust-unit-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            args: '--bundles nsis,msi'
          - platform: macos-universal
            os: macos-latest
            args: '--target universal-apple-darwin --bundles dmg'
          - platform: linux-x64
            os: ubuntu-22.04
            args: '--bundles appimage,deb'

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux Tauri & Capture system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libclang-dev pkg-config

      - name: Install Tauri CLI
        working-directory: app
        run: npm install

      - name: Generate Platform Icons (.ico / .icns / PNGs)
        working-directory: app
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build Native Installer Bundle
        working-directory: app
        run: npx tauri build ${{ matrix.args }}

      - name: Upload Multi-Platform Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: copytodesk-${{ matrix.platform }}
          path: |
            app/target/**/release/bundle/nsis/*.exe
            app/target/**/release/bundle/msi/*.msi
            app/target/**/release/bundle/dmg/*.dmg
            app/target/**/release/bundle/appimage/*.AppImage
            app/target/**/release/bundle/deb/*.deb
          if-no-files-found: warn

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-bundles
    runs-on: ubuntu-22.04
    steps:
      - name: Download All Multi-Platform Bundles
        uses: actions/download-artifact@v4
        with:
          path: release-bundles

      - name: Create GitHub Release with Direct Installer Links
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-bundles/**/*.exe
            release-bundles/**/*.msi
            release-bundles/**/*.dmg
            release-bundles/**/*.AppImage
            release-bundles/**/*.deb
