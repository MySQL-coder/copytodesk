[package]
name = "ctd-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ctd-protocol = { path = "../ctd-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
sha2.workspace = true
hex.workspace = true
image.workspace = true
base64.workspace = true
rand.workspace = true
tracing.workspace = true
thiserror.workspace = true

[features]
default = []
# Enable native OS screen capture via `xcap` (Win DXGI/GDI, macOS SCK/CG, Linux PipeWire/X11)
native-capture = ["dep:xcap"]

[dependencies.xcap]
version = "0.3"
optional = true
